name: AVIA Social CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brightbean_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      SECRET_KEY: ci-only-never-use-in-production
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/brightbean_test
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock
      - run: ruff check apps/avia_brand config/settings/avia.py config/settings/avia_test.py scripts/setup.py
      - run: ruff format --check apps/avia_brand config/settings/avia.py config/settings/avia_test.py scripts/setup.py
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest apps/avia_brand apps/accounts apps/common/tests/test_review_banner.py tests/test_oauth_pkce.py apps/members apps/composer apps/calendar apps/approvals apps/api apps/publisher tests/test_media_routing.py
      - run: python3 scripts/setup.py
      - run: docker compose config --quiet
      - run: docker compose build app
      - run: docker compose up -d --wait app worker
      - run: curl --retry 10 --retry-delay 3 --retry-connrefused -f http://localhost:8088/health/
      - if: always()
        run: docker compose logs --tail=80
      - if: always()
        run: docker compose down
