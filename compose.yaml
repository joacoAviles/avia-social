name: avia-social
x-app: &app
  build: .
  image: avia-social:0.2.0-rc.1
  env_file: .env
  environment:
    DATABASE_URL: postgres://avia:${POSTGRES_PASSWORD}@postgres:5432/avia
    DJANGO_SETTINGS_MODULE: config.settings.avia
  init: true
  security_opt: [no-new-privileges:true]
  volumes:
    - media:/app/media
    - ./secrets:/run/secrets/avia:ro
services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: avia
      POSTGRES_USER: avia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup.py}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U avia -d avia]
      interval: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    command: python manage.py migrate --noinput
    depends_on:
      postgres: {condition: service_healthy}
  app:
    <<: *app
    ports: ["127.0.0.1:${AVIA_PORT:-8088}:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8000/health/]
      interval: 15s
      retries: 10
    restart: unless-stopped
  worker:
    <<: *app
    command: python manage.py run_studio_worker
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
  cloudflared:
    image: cloudflare/cloudflared:2026.10.6@sha256:004d843fa5fdc3103983fd580ee19fab4a8fa98add31f87249c1659e848c98e0
    profiles: [cloudflare]
    command: [tunnel, --no-autoupdate, --loglevel, warn, run, --token-file, /run/tunnel.token]
    user: "${AVIA_TUNNEL_UID:-65532}:${AVIA_TUNNEL_GID:-65532}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ./.cloudflare/tunnel.token
        target: /run/tunnel.token
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
  n8n:
    image: n8nio/n8n:1.114.4
    profiles: [n8n]
    ports: ["127.0.0.1:5688:5678"]
    environment:
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
    volumes: [n8n:/home/node/.n8n]
volumes:
  database:
  media:
  n8n:
