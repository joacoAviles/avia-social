<!-- Trustpilot review ask. Rendered only when sidebar_context sets
     show_review_banner; closing it or clicking through hides it until the
     next login (User.review_banner_dismissed_at vs last_login). -->
<div class="sidebar-review-banner px-3 pb-3"
     x-data="{
         open: true,
         dismiss() {
             this.open = false;
             var tokenInput = document.querySelector('[name=csrfmiddlewaretoken]');
             fetch('{% url 'accounts:dismiss_review_banner' %}', {
                 method: 'POST',
                 headers: { 'X-CSRFToken': tokenInput ? tokenInput.value : '' },
                 keepalive: true,
             });
         },
     }"
     x-show="open && !sidebarCollapsed">
    <div class="relative rounded-xl border border-stone-200 bg-white p-3.5 shadow-sm">
        <button type="button" @click="dismiss()"
                class="absolute top-2.5 right-2.5 w-6 h-6 flex items-center justify-center rounded-md text-stone-400 hover:text-stone-600 hover:bg-stone-100 transition-colors cursor-pointer"
                aria-label="Dismiss" title="Dismiss">
            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
        <p class="mt-2 text-sm font-semibold text-stone-900">Tu operación, en un solo lugar</p>
        <p class="mt-1 text-xs leading-relaxed text-stone-500">Consulta la guía de AVIA Social para configurar tu espacio.</p>
        <a href="https://github.com/joacoAviles/avia-social#readme" target="_blank" rel="noopener noreferrer"
           @click="dismiss()"
           class="mt-3 w-full flex items-center justify-center gap-1.5 px-3 py-1.5 text-[0.8125rem] font-semibold text-stone-800 bg-white border border-stone-200 rounded-full hover:bg-black/[0.04] transition-colors">
            Abrir documentación
            <svg class="text-stone-400" width="13" height="13" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
    </div>
</div>
